[tools]
go = "1.27.3"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build paperhunt binary into bin/paperhunt"
run = "go build -o bin/paperhunt ./cmd/paperhunt"

[tasks.install]
description = "Install or upgrade global paperhunt release binary via mise"
run = "mise up github:samhvw8/paperhunt"

[tasks.test]
description = "Run unit tests (offline deterministic)"
run = "CGO_ENABLED=1 go test -race ./..."

[tasks.vet]
run = "go vet ./... && GOOS=linux go vet ./..."

[tasks.fmt-check]
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.check]
description = "gofmt, vet, race tests, and OKF validation"
depends = ["fmt-check", "vet", "test", "docs:validate"]

[tasks."docs:validate"]
run = "uv run ~/.omp/agent/skills/validate/scripts/okf_validate.py .okf --strict"
